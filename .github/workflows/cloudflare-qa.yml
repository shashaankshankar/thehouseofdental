name: Cloudflare QA gate

on:
  push:
    branches: [qa]
  pull_request:
    branches: [qa, main]

permissions:
  contents: read

jobs:
  check:
    name: Build and validate Worker artifact
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run Cloudflare validation gate
        run: npm run check:ci
