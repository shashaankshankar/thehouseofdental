<!--
  Reusable Phase 2 HTML patterns. These snippets are source guidance for new
  page fragments; the build keeps all main copy as ordinary HTML.
-->

<!-- Service and category cards: prefer crawlable links for durable destinations. -->
<a class="svc-card category-card" href="services/example/index.html">
  <div class="body"><span class="cat">Category</span><h3>Service name</h3><span class="more">Explore service</span></div>
</a>

<!-- Buttons/links: use a link for navigation and a button for an in-page action. -->
<a class="btn btn-solid" href="{{APPOINTMENT_HREF}}">Request an Appointment</a>
<button class="btn" type="button">Open details</button>

<!-- Breadcrumbs: the build supplies the route-specific links at {{BREADCRUMB}}. -->
<nav class="crumb" aria-label="Breadcrumb"><a href="index.html">Home</a><span aria-hidden="true">/</span><span aria-current="page">Current page</span></nav>

<!-- Dialogs: keep the dialog only where an inline preview is useful. main.js manages focus. -->
<div class="svcmodal" role="dialog" aria-modal="true" aria-labelledby="dialog-title" aria-hidden="true">
  <div class="backdrop" data-close></div>
  <div class="panel"><button class="close" type="button" data-close aria-label="Close">&times;</button><h2 id="dialog-title">Details</h2></div>
</div>

<!-- Labeled form fields, inline errors, and a status region. Never collect sensitive details here. -->
<div class="field"><label for="example-name">Full Name</label><input id="example-name" name="name" required aria-describedby="example-name-error"><p id="example-name-error" class="form-error" role="alert" hidden>Please enter your name.</p></div>
<div class="form-status" role="status" aria-live="polite" hidden></div>

<!-- FAQ disclosure, trust/review callout, responsive image, and related services. -->
<details class="faq-item"><summary>What should I expect?</summary><div class="faq-answer"><p>Use approved page copy here.</p></div></details>
<aside class="trust-callout"><p class="eyebrow">Patient Perspective</p><p>Use an approved review or proof point with its source and date.</p></aside>
<img src="assets/example.jpg" srcset="assets/example-640.jpg 640w, assets/example-1280.jpg 1280w" sizes="(max-width: 700px) 100vw, 50vw" width="1280" height="853" loading="lazy" alt="Approved descriptive alternative text">
<nav class="related-services" aria-label="Related services"><a href="/services/same-day-crowns/">Same-Day Crowns</a><a href="/services/dental-implants/">Dental Implants</a></nav>
