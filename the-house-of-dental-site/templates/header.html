<header class="site">
  <div class="wrap nav">
    <a class="brand" href="{{HOME_HREF}}" aria-label="{{BRAND_NAME}} — home"><img class="logo-img" src="{{ASSET_HREF:logo.svg}}" alt="{{BRAND_NAME}} — home" width="270" height="63"></a>
    <button class="burger" type="button" aria-expanded="false" aria-controls="primary-navigation" aria-label="Open menu"><span></span><span></span><span></span></button>
    <ul id="primary-navigation" class="menu" aria-label="Primary navigation">
      {{MOBILE_NAV_ACTIONS}}
      {{TOP_LEVEL_NAV}}
      <li class="nav-phone"><a href="{{PHONE_HREF}}" data-hod-event="click_to_call" data-hod-cta-location="header_phone" data-hod-conversion-type="call">{{PHONE_DISPLAY}}</a></li>
      <li><a class="btn btn-solid" href="{{APPOINTMENT_HREF}}" data-hod-event="appointment_click" data-hod-cta-location="header_request" data-hod-conversion-type="appointment_request" style="padding:0.7rem 1.6rem">Request Appointment</a></li>
    </ul>
  </div>
</header>
